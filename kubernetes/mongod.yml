apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: my-mongodb
spec:
  members: 3
  type: ReplicaSet
  version: "8.2" # or your preferred version
  security:
    authentication:
      modes: ["SCRAM"]
    keyFile:
      secretRef:
        name: my-mongodb-keyfile
  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: my-mongodb-admin-password
      roles:
        - name: root
          db: admin
  statefulSet:
    spec:
      template:
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "500m"
                limits:
                  memory: "4Gi"
                  cpu: "1"
  additionalMongodConfig:
    storage:
      dbPath: /data/db
  storage:
    type: Persistent
    storageClass: standard
    size: 10Gi