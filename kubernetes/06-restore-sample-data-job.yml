apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-restore-sample-data
  namespace: mongodb
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: restore-data
          image: mongodb/mongodb-community-server:8.2.0-ubi8
          imagePullPolicy: IfNotPresent
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdb-admin-user-password
                  key: password
          volumeMounts:
            - name: sample-archive
              mountPath: /data
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              
              MONGO_URI="mongodb://mdb-admin:${ADMIN_PASSWORD}@mongodb-svc:27017/admin?authSource=admin"
              ARCHIVE_PATH="/data/sampledata.archive"
              
              echo "Waiting for MongoDB to become reachable..."
              for i in {1..60}; do
                if mongosh "$MONGO_URI" --quiet --eval "db.adminCommand('ping').ok" | grep -q "1"; then
                  echo "✓ MongoDB is reachable"
                  break
                fi
                sleep 2
              done
              
              echo "Checking for sample data archive at $ARCHIVE_PATH..."
              if [ ! -f "$ARCHIVE_PATH" ]; then
                echo ""
                echo "ℹ️  Archive not found. This is optional - metrics Job already seeded minimal test data."
                echo ""
                echo "To restore full MongoDB sample datasets:"
                echo "  1. Download: curl https://atlas-education.s3.amazonaws.com/sampledata.archive -o sampledata.archive"
                echo "  2. Mount the archive into this Job's /data volume"
                echo "  3. Re-run: kubectl apply -f kubernetes/06-restore-sample-data-job.yml"
                echo ""
                exit 0
              fi
              
              echo "Checking for existing sample data..."
              DATA_EXISTS=$(mongosh "$MONGO_URI" --quiet <<'MONGOEOF'
              try {
                const collections = db.getSiblingDB('sample_airbnb').getCollectionNames();
                print(collections.includes('listingsAndReviews') ? 'true' : 'false');
              } catch (e) {
                print('false');
              }
              MONGOEOF
              )
              
              if echo "$DATA_EXISTS" | grep -q "true"; then
                echo "✓ Sample data already exists"
                exit 0
              fi
              
              echo "Restoring sample data from archive..."
              mongorestore --archive="$ARCHIVE_PATH" --uri="$MONGO_URI"
              echo "✓ Sample data restored successfully"
      volumes:
        - name: sample-archive
          emptyDir: {}
