services:
  mongod:
    image: mongodb/mongodb-community-server:latest
    container_name: mongod-community
    environment:
      MONGODB_INITDB_ROOT_USERNAME: admin
      MONGODB_INITDB_ROOT_PASSWORD: ${ADMIN_PASSWORD:-admin}
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:-mongotPassword}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    entrypoint: ["/fix-keyfile-permissions.sh"]
    command:
      - mongod
      - --config
      - /etc/mongod.conf
      - --replSetMember=mongod.search-community:27017
    ports:
      - "27017:27017"
    volumes:
      - mongod_data:/data/db
      - mongod_configdb:/data/configdb
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./keyfile:/keyfile-source:ro
      - ./fix-keyfile-permissions.sh:/fix-keyfile-permissions.sh:ro
      - ./sampledata.archive:/sampledata.archive:ro
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks:
      - search-community
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongot:
    image: mongodb/mongodb-community-search:latest
    container_name: mongot-community
    ports:
      - "27028:27028"  # gRPC server port
      - "8080:8080"    # Health check port  
      - "9946:9946"    # Metrics port
    volumes:
      - mongot_data:/data/mongot
      - ./mongot.conf:/mongot-community/config.default.yml:ro
      - ./passwordFile:/passwordFile:ro
    networks:
      - search-community
    depends_on:
      mongod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://mongot-community.search-community:9946/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB exporter for MongoDB Community Server metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:0.39
    container_name: mongodb-exporter
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://admin:${ADMIN_PASSWORD:-admin}@mongod:27017
    command: 
      - --mongodb.uri=mongodb://admin:${ADMIN_PASSWORD:-admin}@mongod:27017
      - --web.listen-address=0.0.0.0:9216
      - --log.level=info
      - --collector.diagnosticdata
      - --collector.replicasetstatus
      - --collector.dbstats
      - --collector.topmetrics
      - --collector.indexstats
      - --collector.collstats
    networks:
      - search-community
    depends_on:
      mongod:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus server
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - search-community
    depends_on:
      mongod:
        condition: service_healthy
      mongot:
        condition: service_healthy
    restart: unless-stopped

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - search-community
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  mongod_data:
  mongod_configdb:
  mongot_data:

networks:
  search-community:
    name: search-community
    driver: bridge
    external: true